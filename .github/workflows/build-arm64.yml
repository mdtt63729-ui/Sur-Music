name: Build arm64-v8a APK

# One signed release APK for arm64-v8a, downloadable from the run's artifacts.
# The ABI split list is narrowed for the build only — app/build.gradle.kts in the
# checkout is left untouched, so nothing here changes what the repo ships.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No setup-android action: it shells out to `sdkmanager tools`, a package
      # the current command-line tools no longer publish, and the job dies
      # before compiling anything. The runner image already carries the SDK and
      # ANDROID_HOME, so its own sdkmanager is used directly.
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;37.0.0" "ndk;27.0.12077973"
          # API 37 ships as both `android-37` and `android-37.0`; take whichever
          # this repository offers and add the name AGP looks for.
          "$SDKMGR" "platforms;android-37" || "$SDKMGR" "platforms;android-37.0"
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -d "$SDK/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi
          # The build pins CMake 3.22.1. Where the SDK no longer offers it, point
          # Gradle at the runner's own CMake instead.
          "$SDKMGR" "cmake;3.22.1" || {
            CM="$(dirname "$(dirname "$(readlink -f "$(which cmake)")")")"
            echo "cmake.dir=$CM" > local.properties
          }
          ls "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk"

      - name: Signing key for this build
        run: |
          keytool -genkeypair -keystore bitme.jks -alias bitchord \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bitchord123 -keypass bitchord123 \
            -dname "CN=BitChord, OU=Build, O=BitChord, L=NA, S=NA, C=IN"
          printf 'storeFile=bitme.jks\nstorePassword=bitchord123\nkeyAlias=bitchord\nkeyPassword=bitchord123\n' > keystore.properties

      - name: Narrow the ABI splits to arm64-v8a
        run: |
          python3 - <<'PYEOF'
          p = "app/build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          old = 'include("armeabi-v7a", "arm64-v8a", "x86_64")'
          new = 'include("arm64-v8a")'
          assert s.count(old) == 1, "splits include not found"
          s = s.replace(old, new).replace("isUniversalApk = true", "isUniversalApk = false")
          open(p, "w", encoding="utf-8").write(s)
          print("narrowed to arm64-v8a")
          PYEOF

      - name: Build prod release
        run: ./gradlew :app:assembleProdRelease --no-daemon --stacktrace

      - name: Show outputs
        if: always()
        run: find app/build/outputs -name '*.apk' -printf '%p %s bytes\n' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-arm64-v8a
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
