name: Build arm64-v8a APK

# One signed release APK for arm64-v8a, downloadable from the run's artifacts.
# Package: com.manikdev.bit (prod flavour).
# The ABI split list is narrowed for the build only — app/build.gradle.kts in the
# checkout is left untouched, so nothing here changes what the repo ships.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'wearos/**'
      - 'tv/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Needed to publish the APK as a release asset.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No setup-android action: it shells out to `sdkmanager tools`, a package
      # the current command-line tools no longer publish, and the job dies
      # before compiling anything. The runner image already carries the SDK and
      # ANDROID_HOME, so its own sdkmanager is used directly.
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "build-tools;37.0.0" "ndk;27.0.12077973"
          # API 37 ships as both `android-37` and `android-37.0`; take whichever
          # this repository offers and add the name AGP looks for.
          "$SDKMGR" "platforms;android-37" || "$SDKMGR" "platforms;android-37.0"
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -d "$SDK/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK/platforms/android-37"
          fi
          # The build pins CMake 3.22.1. Where the SDK no longer offers it, point
          # Gradle at the runner's own CMake instead.
          "$SDKMGR" "cmake;3.22.1" || {
            CM="$(dirname "$(dirname "$(readlink -f "$(which cmake)")")")"
            echo "cmake.dir=$CM" > local.properties
          }
          ls "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk"

      # The signing key lives in the repository's Actions secrets, so every
      # build is signed by the same identity and a new APK installs over the
      # last one instead of needing an uninstall first.
      - name: Signing key from secrets
        env:
          # The keystore itself, base64-encoded, under whichever name it was
          # stored; the first non-empty one wins.
          KS: ${{ secrets.SIGNING_KEY || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE || secrets.SIGNING_KEYSTORE }}
          STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS || secrets.KEY_ALIAS || secrets.KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD }}
          # Reporting only: which of the usual names the repo actually has, so a
          # mismatch shows up in the log instead of as a failed build.
          K1: ${{ secrets.SIGNING_KEY }}
          K2: ${{ secrets.KEYSTORE_BASE64 }}
          K3: ${{ secrets.KEYSTORE }}
          K4: ${{ secrets.KEYSTORE_FILE }}
          P1: ${{ secrets.KEY_STORE_PASSWORD }}
          P2: ${{ secrets.KEYSTORE_PASSWORD }}
          A1: ${{ secrets.ALIAS }}
          A2: ${{ secrets.KEY_ALIAS }}
          W1: ${{ secrets.KEY_PASSWORD }}
          W2: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "secrets present:"
          for pair in "SIGNING_KEY=$K1" "KEYSTORE_BASE64=$K2" "KEYSTORE=$K3" \
                      "KEYSTORE_FILE=$K4" "KEY_STORE_PASSWORD=$P1" "KEYSTORE_PASSWORD=$P2" \
                      "ALIAS=$A1" "KEY_ALIAS=$A2" "KEY_PASSWORD=$W1" \
                      "KEYSTORE_KEY_PASSWORD=$W2"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -n "$value" ]; then echo "  $name: set"; else echo "  $name: -"; fi
          done

          if [ -z "${KS:-}" ]; then
            echo "::error::No keystore secret found. Store the .jks base64-encoded as SIGNING_KEY."
            exit 1
          fi
          for v in STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty — this build reads KEY_STORE_PASSWORD, ALIAS and KEY_PASSWORD."
              exit 1
            fi
          done

          # Accepts a base64 blob (usual) or the keystore written out as text.
          if printf '%s' "$KS" | base64 -d -i > bitme.jks 2>/dev/null && [ -s bitme.jks ]; then
            echo "keystore decoded from base64"
          else
            printf '%s' "$KS" > bitme.jks
            echo "keystore written as-is"
          fi

          # Fail here, in seconds, rather than twelve minutes later at signing.
          keytool -list -keystore bitme.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" > /dev/null
          echo "keystore opens and the alias exists"

          printf 'storeFile=bitme.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Narrow the ABI splits to arm64-v8a
        run: |
          python3 - <<'PYEOF'
          p = "app/build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          old = 'include("armeabi-v7a", "arm64-v8a", "x86_64")'
          new = 'include("arm64-v8a")'
          assert s.count(old) == 1, "splits include not found"
          s = s.replace(old, new).replace("isUniversalApk = true", "isUniversalApk = false")
          open(p, "w", encoding="utf-8").write(s)
          print("narrowed to arm64-v8a")
          PYEOF

      - name: Build prod release
        run: ./gradlew :app:assembleProdRelease --no-daemon --stacktrace

      - name: Show outputs
        if: always()
        run: find app/build/outputs -name '*.apk' -printf '%p %s bytes\n' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-arm64-v8a
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error

      # Every build lands on Releases. The tag is the app's own version, so a
      # run for 1.10 replaces 1.10's asset instead of piling up a release per
      # commit; a version bump opens a new release by itself.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'bitchordVersionName' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          TAG="v${VERSION}"
          APK="$(find app/build/outputs/apk/prod/release -name '*arm64-v8a*.apk' | head -1)"
          ASSET="BitChord-${VERSION}-com.manikdev.bit-arm64-v8a.apk"
          cp "$APK" "$ASSET"
          SHA="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          NOTES="$(printf '%s\n' \
            "Built from ${GITHUB_SHA:0:7} on main." \
            "" \
            "**Package** \`com.manikdev.bit\` · **ABI** arm64-v8a · **minSdk** 26" \
            "" \
            "**SHA-256** \`${SHA}\`" \
            "" \
            "Signed with the repository's own key, so this installs over the last" \
            "build of the same package:" \
            "" \
            '```' \
            "adb install -r ${ASSET}" \
            '```')"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "BitChord ${VERSION}" --notes "$NOTES"
          else
            gh release create "$TAG" "$ASSET" \
              --title "BitChord ${VERSION}" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          echo "published $ASSET to $TAG"
          gh release view "$TAG" --json url -q .url
